<svg width="100%" viewBox="0 0 900 430" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Home Lab architecture</title>
  <desc>Proxmox host running Home Assistant, Media Server, Infra, and Dev virtual machines plus an AdGuard Home LXC container</desc>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; text-anchor: middle; dominant-baseline: central; }
    .host { fill: #444441; stroke: #b4b2a9; }
    .host-text { fill: #d3d1c7; font-size: 15px; font-weight: 600; }
    .column-header, .column-body { stroke-width: 1; }
    .heading { font-size: 13px; font-weight: 600; }
    .service { font-size: 12px; }
    .detail { font-size: 11px; opacity: .88; }
    .divider { stroke: #fff; stroke-width: .7; opacity: .2; }
  </style>

  <rect class="host" x="10" y="10" width="880" height="46" rx="8"/>
  <text class="host-text" x="450" y="33">Proxmox</text>

  <!-- Home Assistant VM -->
  <g>
    <rect class="column-header" x="10" y="72" width="166" height="48" rx="8" fill="#3c3489" stroke="#afa9ec"/>
    <text class="heading" x="93" y="96" fill="#cecbf6">Home Assistant VM</text>
    <rect class="column-body" x="10" y="128" width="166" height="282" rx="8" fill="#3c3489" stroke="#afa9ec"/>
    <text class="service" x="93" y="260" fill="#afa9ec">Home Assistant OS</text>
    <text class="detail" x="93" y="282" fill="#cecbf6">Smart home · automations</text>
  </g>

  <!-- Media Server VM -->
  <g>
    <rect class="column-header" x="186" y="72" width="166" height="48" rx="8" fill="#085041" stroke="#5dcaa5"/>
    <text class="heading" x="269" y="96" fill="#9fe1cb">Media Server VM</text>
    <rect class="column-body" x="186" y="128" width="166" height="282" rx="8" fill="#085041" stroke="#5dcaa5"/>
    <text class="service" x="269" y="150" fill="#5dcaa5">Jellyfin · Jellyseerr</text>
    <line class="divider" x1="205" y1="170" x2="333" y2="170"/>
    <text class="service" x="269" y="190" fill="#5dcaa5">Sonarr · Radarr</text>
    <line class="divider" x1="205" y1="210" x2="333" y2="210"/>
    <text class="service" x="269" y="230" fill="#5dcaa5">Prowlarr · qBittorrent</text>
    <line class="divider" x1="205" y1="250" x2="333" y2="250"/>
    <text class="service" x="269" y="270" fill="#5dcaa5">Bazarr</text>
    <line class="divider" x1="205" y1="290" x2="333" y2="290"/>
    <text class="service" x="269" y="310" fill="#5dcaa5">Audiobookshelf</text>
    <line class="divider" x1="205" y1="330" x2="333" y2="330"/>
    <text class="service" x="269" y="350" fill="#5dcaa5">Calibre · Homarr</text>
  </g>

  <!-- Infra VM -->
  <g>
    <rect class="column-header" x="362" y="72" width="166" height="48" rx="8" fill="#633806" stroke="#ef9f27"/>
    <text class="heading" x="445" y="96" fill="#fac775">Infra VM</text>
    <rect class="column-body" x="362" y="128" width="166" height="282" rx="8" fill="#633806" stroke="#ef9f27"/>
    <text class="service" x="445" y="185" fill="#ef9f27">n8n</text>
    <text class="detail" x="445" y="205" fill="#fac775">Workflow automation</text>
    <line class="divider" x1="381" y1="230" x2="509" y2="230"/>
    <text class="service" x="445" y="260" fill="#ef9f27">Netdata</text>
    <text class="detail" x="445" y="280" fill="#fac775">Observability</text>
    <line class="divider" x1="381" y1="305" x2="509" y2="305"/>
    <text class="service" x="445" y="335" fill="#ef9f27">AI Sport Coach</text>
    <text class="detail" x="445" y="355" fill="#fac775">Persistent AI system</text>
  </g>

  <!-- Dev VM -->
  <g>
    <rect class="column-header" x="538" y="72" width="166" height="48" rx="8" fill="#62306f" stroke="#d59ae6"/>
    <text class="heading" x="621" y="96" fill="#edc7f5">Dev VM</text>
    <rect class="column-body" x="538" y="128" width="166" height="282" rx="8" fill="#62306f" stroke="#d59ae6"/>
    <text class="service" x="621" y="175" fill="#d59ae6">Codex</text>
    <line class="divider" x1="557" y1="198" x2="685" y2="198"/>
    <text class="service" x="621" y="225" fill="#d59ae6">Claude</text>
    <line class="divider" x1="557" y1="248" x2="685" y2="248"/>
    <text class="service" x="621" y="275" fill="#d59ae6">OpenCode</text>
    <line class="divider" x1="557" y1="298" x2="685" y2="298"/>
    <text class="service" x="621" y="325" fill="#d59ae6">Development tools</text>
    <text class="detail" x="621" y="347" fill="#edc7f5">Workspaces · agents</text>
  </g>

  <!-- AdGuard Home LXC -->
  <g>
    <rect class="column-header" x="714" y="72" width="176" height="48" rx="8" fill="#0c447c" stroke="#85b7eb"/>
    <text class="heading" x="802" y="90" fill="#b5d4f4">AdGuard Home</text>
    <text class="detail" x="802" y="108" fill="#85b7eb">LXC container</text>
    <rect class="column-body" x="714" y="128" width="176" height="282" rx="8" fill="#0c447c" stroke="#85b7eb"/>
    <text class="service" x="802" y="250" fill="#85b7eb">DNS · ad blocking</text>
    <text class="detail" x="802" y="272" fill="#b5d4f4">Network-wide filtering</text>
  </g>
</svg>
